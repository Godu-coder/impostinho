<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">


<head>
	<meta charset="UTF-8">
	<title>Cadastro de Consulta</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/components.css}">
</head>

<body>
  
    <header th:replace="~{fragments/util :: cabecalho}"></header>

    <div class="caixa">
        <h2>Cadastro de consulta</h2>

        <form th:action="@{/consulta/salvar}" method="post" th:object="${consulta}">
            <p class="campo">
                <label for="input-horario">Horário:</label>
                <input type="datetime-local" id="input-horario" name="horario" placeholder="Digite o horário">
				<div th:if="${mensagemErro}" class="alert alert-erro" th:text="${mensagemErro}"></div>
            </p>

            <p class="campo">
                <label for="input-medico">Médico:</label>
                <select id="input-medico" name="medicoId" th:field="*{medico.id}">
                    <option value="" disabled selected>Selecione um médico</option>
                    <option th:each="m : ${listaMedico}" th:value="${m.id}" th:text="${m.nome}"></option>
                </select>
            </p>

            <p class="campo">
                <label for="input-paciente">Paciente:</label>
                <select id="input-paciente" name="pacienteId" th:field="*{paciente.id}">
                    <option value="" disabled selected>Selecione um paciente</option>
                    <option th:each="p : ${listaPaciente}" th:value="${p.id}" th:text="${p.nome}"></option>
                </select>
            </p>

            <div class="acoes">
                
                <input type="submit" value="Salvar" class="btn-salvar">
				<a th:href="@{/consulta/listar}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>

		
	
  
	<footer th:replace="~{fragments/util :: rodape}"></footer>
	

</body>
</html>
