<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Listagem de Consultas</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>
	
	<header th:replace="~{fragments/util :: cabecalho}"></header>
	
	<main class="conteudo-principal">
		<h2 th:text="${passadas} ? 'Consultas Passadas' : 'Próximas Consultas'">Lista de Consultas</h2>

		<div class="tabela-container">
			<table>
				<thead>
					<tr>
						<th>Horário</th>
						<th>Médico</th>
						<th>Paciente</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="c : ${listaC}">
						<td th:text="${#temporals.format(c.horario, 'dd/MM/yyyy HH:mm')}"></td>
						<td th:text="${c.medico.nome}"></td>
						<td th:text="${c.paciente.nome}"></td>
					</tr>
				</tbody>
			</table>
			
		</div>
		
		<a th:if="${!passadas}" th:href="@{/consulta/listar(passadas=true)}" class="btn-editar">Ver consultas passadas</a>
		<a th:if="${passadas}" th:href="@{/consulta/listar}" class="btn-editar">Ver próximas consultas</a>
		<p>
		<a th:href="@{/consulta/cadastro}" class="btn-salvar" sec:authorize="hasAnyRole('ADMIN','ATENDENTE')">+ Nova Consulta</a>
		
	</main>
	<footer th:replace="~{fragments/util :: rodape}"></footer>
</body>
</html>
