<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Listagem de Pacientes</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>

	<header th:replace="~{fragments/util :: cabecalho}"></header>

			
	<main class="conteudo-principal">
		<h2>Lista de Pacientes</h2>
		<div class="tabela-container">

			<table>
				<thead>
					<tr>
						<th>Nome</th>
						<th>Cpf</th>
						<th>Data de nascimento</th>
						<th>Telefone</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="p : ${listaP}">
						<td th:text="${p.nome}"></td>
						<td th:text="${p.cpfFormatada}"></td>
						<td th:text="${p.dataNascimento} ? ${#temporals.format(p.dataNascimento, 'dd/MM/yyyy')} : ''"></td>
						<td th:text="${p.foneFormatado}"></td>

						<td>
						<a th:href="@{/paciente/editar(id=${p.id})}" class="btn-editar">Editar</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
	<a th:href="@{/paciente/cadastro}" class="btn-salvar">+ Novo Paciente</a>
	
	<footer th:replace="~{fragments/util :: rodape}"></footer>
	
</body>
</html>
