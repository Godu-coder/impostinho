<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
		<title>Editar Paciente</title>
		<link rel="stylesheet" th:href="@{/css/base.css}">
		<link rel="stylesheet" th:href="@{/css/layout.css}">
		<link rel="stylesheet" th:href="@{/css/components.css}">
</head>

<body>

	<header th:replace="~{fragments/util :: cabecalho}"></header>
	
	<div class="caixa">
		<h2>Editar paciente</h2>

		<form th:action="@{salvar}" th:object="${paciente}" method="post">

			<input type="hidden" th:field="*{id}" />
			<input type="hidden" th:field="*{nome}" />
			<input type="hidden" th:field="*{cpf}" />
			
			<div class="campo">
				<label>Nome:</label>
				<input type="text" th:field="*{nome}" disabled class="campo-bloqueado"/>
			</div>

			<div class="campo">
				<label>CPF:</label>
				<input type="text" th:value="*{cpf}" disabled class="campo-bloqueado" />
			</div>

			<div class="campo">
				<label>Data de Nascimento:</label>
				<input type="date" name="dataNascimento" th:value="${#dates.format(paciente.dataNascInput, 'yyyy-MM-dd')}"/>
			</div>
			
			<div class="campo">
				<label>Endereço:</label>
				<input type="text" th:field="*{endereco}"/>
			</div>
			
			<div class="campo">
				<label>Telefone:</label>
				<input type="tel" th:field="*{telefone}" minlength="13" maxlength="13"/>
			</div>
			
			<div class="campo">
				<label>Sexo:</label>
				<input type="text" th:field="*{sexo}"/>
			</div>
			
			<div class="campo">
				<label>Alergia:</label>
				<input type="text" th:field="*{alergia}"/>
			</div>

			<div class="acoes">
				<button type="submit" class="btn-salvar">Salvar Alterações</button>
				<a th:href="@{/paciente/listar}" class="btn-cancelar">Cancelar</a>
			</div>
		</form>
	</div>

	<footer th:replace="~{fragments/util :: rodape}"></footer>
	
</body>

</html>
