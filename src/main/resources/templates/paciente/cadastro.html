<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Cadastro de Pacientes</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>
	
	<header th:replace="~{fragments/util :: cabecalho}"></header>
	
	<main class="conteudo-principal">
		<div class="formulario-conteiner">
			<h2 class="titulo-form">Cadastro de Paciente</h2>
			<form th:action="@{salvar}" method="post" th:object="${paciente}">
				<div class="conteudo-form">
					<div class="campo">
						<label for="input-nome">Nome: </label>
						<input type="text" id="input-nome" th:field="*{nome}" placeholder="Digite o nome">
					</div>
					<div class="campo">
						<label for="input-cpf">CPF: </label>
						<input type="text" id="input-cpf" th:field="*{cpf}" maxlength="11" placeholder="Digite o CPF">
					</div>
					<div class="campo">
						<label for="input-sexo">Sexo:</label>
						<select id="sexo" th:field="*{sexo}" class="campo" required>
						<option value="m">Masculino</option>
						<option value="f">Feminino</option>
						</select>
					</div>
					<div class="campo">
						<label for="input-data-nascimento">Data de nascimento: </label>
						<input type="date" id="input-data-nascimento" th:field="*{dataNascimento}" placeholder="Digite uma data">
					</div>
					<div class="campo">
						<label for="input-telefone">Telefone: </label>
						<input type="tel" id="input-telefone" th:field="*{telefone}" minlength="13" maxlength="13" placeholder="Digite o telefone">
					</div>
					<div class="campo">
						<label for="input-endereco">Endereço: </label>
						<input type="text" id="input-endereco" th:field="*{endereco}" placeholder="Digite o endereço">
					</div>
					<div class="campo campo-largura-total">
						<label for="input-alergias">Alergias:</label>
						<input type="text" id="input-alergias" th:field="*{alergia}" placeholder="Digite as alergias">
					</div>
					<div class="campo">
						<label for="input-nome-usuario">Nome de Usuário: </label>
						<input type="text" id="input-nome-usuario" th:field="*{username}" placeholder="Digite o nome de usuário">
					</div>
					<div class="campo">
						<label for="input-senha-usuario">Senha: </label>
						<input type="password" id="input-senha-usuario" th:field="*{senha}" placeholder="Digite a senha de usuário">
					</div>
				</div>
				<div class="acoes">
					<button type="submit" class="btn-salvar">Salvar</button>
					<a th:href="@{/paciente/listar}" class="btn-cancelar">Cancelar</a>
				</div>
			</form>
		</div>
	</main>
	
	<footer th:replace="~{fragments/util :: rodape}"></footer>
	
</body>
</html>
