<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Editar Médico</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>
	
	<header th:replace="~{fragments/util :: cabecalho}"></header>
	
	<div class="caixa">
		<h2>Editar Médico</h2>
		<form th:action="@{salvar}" th:object="${medico}" method="post">
			
			<input type="hidden" th:field="*{id}" />
			<input type="hidden" th:field="*{cpf}" />
			<input type="hidden" th:field="*{dataAdmissao}" />
			
			<div class="campo">
				<label>Nome:</label>
				<input type="text" th:field="*{nome}" required />
			</div>
			<div class="campo">
				<label>Especialidade:</label>
				<input type="text" th:field="*{especialidade}" required />
			</div>
			<div class="campo">
				<label>CPF:</label>
				<input type="text" th:value="*{cpf}" disabled class="campo-bloqueado" />
			</div>
			<div class="campo">
				<label>Data de Admissão:</label>
				<input type="text" th:value="*{DataAdmissaoFormatada}" disabled class="campo-bloqueado" />
			</div>
			<div class="acoes">
				<a th:href="@{/medico/demitir (id=*{id})}"  class="btn-cancelar">Demitir</a>
				<button type="submit" class="btn-salvar">Salvar Alterações</button>
				<a th:href="@{/medico/listar}" class="btn-cancelar">Cancelar</a>
			</div>
		</form>
	</div>
	
	<footer th:replace="~{fragments/util :: rodape}"></footer>
	
</body>
</html>
