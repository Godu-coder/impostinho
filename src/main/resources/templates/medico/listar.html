<!DOCTYPE html>
<head>
	<meta charset="UTF-8">
	<title>Lista de médicos</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>
	

	<header th:replace="~{fragments/util :: cabecalho}"></header>
	

	<div class="caixa">
		<h2>Lista de médicos</h2>

		<table>
			<tr>
				<th>Nome</th>
				<th>Especialidade</th>
				<th>Data de admissão</th>
				<th>Cpf</th>
				<th>Ações</th>
			</tr>
			<tr th:each="medicos : ${listaM}">
				<td th:text="${medicos.nome}"></td>
				<td th:text="${medicos.especialidade}"></td>
				<td th:text="${medicos.DataAdmissaoFormatada}"></td>
				<td th:text="${medicos.cpfFormatada}"></td>
				<td>
					<a th:href="@{/medico/editar(id=${medicos.id})}" class="btn-editar">Editar</a>
				</td>
			</tr>
		</table>
	</div>

	<a th:href="@{/medico/cadastro}" class="btn-salvar ">+ Novo Médico</a>
	
	<footer th:replace="~{fragments/util :: rodape}"></footer>
	
</body>
</html>
